services:
  - type: web
    name: weather-mcp
    runtime: docker
    rootDir: mcp-server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PORT
        value: "8000"
      - key: PORT
        value: "8000"
      # Optional allowlist (e.g. weather-mcp-xxxx.onrender.com). Leave unset to
      # disable localhost-only Host guard on cloud (fixes 421 Misdirected Request).
      - key: MCP_ALLOWED_HOSTS
        sync: false
